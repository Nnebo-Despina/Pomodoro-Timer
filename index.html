<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="first-header">
        <div class="header-text-div"><p id="header-text">Pomodoro Timer</p><span id="colon"></span><span id="timer-minutes"></span></div>
        <img id="kirby-animation" src="./Img/kirby3.png" alt="">
        <button id="start-button-beginning">START</button>
        <button id="start-button-second">START</button>

        <div id="control-timer">
            <img id="pause-button-beginning" src="./Img/Frame 11.svg" alt="">
            <img id="back-button-beginning" src="./Img/Frame 12.svg" alt="">
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
